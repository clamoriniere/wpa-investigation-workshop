apiVersion: datadoghq.com/v1alpha1
kind: DatadogMetric
metadata:
  name: case06-orders-queue
  namespace: __CASE_NAMESPACE__
  labels:
    workshop-case: "__CASE_ID__"
spec:
  # Stale: the queue was renamed from "orders" to "orders-v2" during a
  # migration, and this saved query was never updated to match. It is a
  # hand-written object, not one of the Cluster Agent's dcaautogen-* ones, so
  # nothing regenerates it automatically.
  query: 'avg:wpa_workshop.orders.queue_depth{case:__CASE_ID__,queue:orders,workshop_name:__WORKSHOP_NAME__}.rollup(30)'
---
apiVersion: datadoghq.com/v1alpha1
kind: WatermarkPodAutoscaler
metadata:
  name: case06-app
  namespace: __CASE_NAMESPACE__
  labels:
    workshop-case: "__CASE_ID__"
spec:
  # See case 01: without "average" the WPA multiplies its target on every
  # reconcile and runs to maxReplicas instead of converging. 100/1 = 100 > 80
  # -> 2 replicas, then 100/2 = 50, inside the 40-80 band, and it settles.
  algorithm: average
  minReplicas: 1
  maxReplicas: 5
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: case06-app
  metrics:
    - type: External
      external:
        # References the DatadogMetric object above by name instead of
        # carrying metricName + metricSelector directly, the way cases 01/02/04
        # do. The Cluster Agent resolves this to that object's own spec.query.
        metricName: "datadogmetric@__CASE_NAMESPACE__:case06-orders-queue"
        highWatermark: "80"
        lowWatermark: "40"
  tolerance: "0.01"
  readinessDelaySeconds: 10
  upscaleForbiddenWindowSeconds: 30
  downscaleForbiddenWindowSeconds: 30
